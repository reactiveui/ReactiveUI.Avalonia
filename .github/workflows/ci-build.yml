name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the reusable workflow can optionally delete the temp per-OS artifacts it creates.
permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      configuration: Release
      productNamespacePrefix: ReactiveUI.Avalonia
      solutionFile: ReactiveUI.Avalonia.slnx
      installWorkloads: true
      # Test only the test projects. The solution also holds the example heads (Android, Browser, iOS, Desktop),
      # which are apps, not tests. 'dotnet test' asks the Android head for a device and fails when none exists.
      testProjects: |
        tests/**/*.csproj
        examples/**/*.Tests.csproj
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  apple-examples:
    runs-on: xcode-27
    env:
      # The .NET Apple SDK requires 27.2; this image defaults to 27.1.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          solution-file: ReactiveUI.Avalonia.Apple.slnx
          install-workloads: 'true'
      - name: Build Apple examples
        uses: reactiveui/actions-common/.github/actions/dotnet-build@main
        with:
          solution-file: ReactiveUI.Avalonia.Apple.slnx
